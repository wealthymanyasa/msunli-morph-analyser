# Shona constraints — declarative.
#
# Constraints are interpreted by the generic engine's constraint validator.
# The `kind` selects a generic interpretation; `params` carry the values.
# No Shona-specific logic lives in the engine.

constraints:
  # Enforce noun-class agreement between a prefix and its nominal stem.
  # The generic validator reads singular/plural pairings from noun_classes.yaml
  # (declarative). This rejects spurious shared-prefix (allomorph) matches:
  # e.g. "mukadzi" should be class 1 (stem kadzi, noun_class 1), not class 3,
  # even though mu- is an allomorph shared by both classes.
  #
  # outer_classes declares the locative classes (16/17/18) that a stacked
  # construction may use as an EXTERNAL prefix over an inner agreeing class
  # (ku-chi-koro -> class 17, mu-mu-rume -> class 18). The exemption is generic:
  # a single such prefix over a disagreeing stem (e.g. ku- over a class-7 stem)
  # is still rejected, and the inner prefix must still agree. The diminutive
  # class 12 is deliberately NOT listed, so ka-mu-kadzi stays invalid.
  - id: noun-class-agreement
    kind: noun_class_agreement
    params:
      outer_classes: ["16", "17", "18"]

  # Verbal stems take the class-15 (infinitive) prefix only. The surface "ku-"
  # is also an allomorph of class 17 (locative); without this restriction a
  # bare verb stem like "enda" could be spuriously segmented as class-17, which
  # is not a valid construction. Declarative: interpreted generically.
  - id: verbal-infinitive-prefix
    kind: affix_stem_pos
    params:
      stem_pos: verb
      affix_classes: ["15"]

  # Conjugated-verb slots (1sg subject agreement + optional perfect) may only
  # contain verb stems. Subject-agreement prefixes must not attach to nominal
  # stems: e.g. "ndamai" (nd-a-mai) is not a valid Shona word — "mai" is a
  # class-1a noun, only verb stems like "enda" accept this conjugation.
  # Declarative: interpreted generically as a slot stem-POS restriction.
  - id: verb-slot-stem-pos
    kind: slot_stem_pos
    params:
      affix_ids: ["sagr-1sg", "tam-perfect"]
      stem_pos: verb
