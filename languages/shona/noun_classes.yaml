# Shona noun classes (mipanda) — structured linguistic data.
#
# Noun classes are NOT reduced to a flat prefix->class dictionary. Each class
# records its underlying prefix morpheme, surface allomorphs, whether it has a
# zero prefix, singular/plural pairing, semantic tendencies, agreement
# concords, representative examples, provenance and confidence.
#
# IMPORTANT about shared/allomorphic surface forms:
#   - mu-/mw-/m  are allomorphs shared by class 1 and class 3. They are NOT
#     separate classes — the same surface maps to distinct underlying classes.
#   - ku- is shared by class 15, class 17 (locative) and the verbal infinitive.
#   - Class 9 and class 1a are modelled with a zero/null prefix in the
#     representative set.
# These distinctions are represented here and in morphemes.yaml; the generic
# engine interprets them as data.
#
# Provenance: Fortune (1984) An Analytical Grammar of Shona; standard
# chiShona course references. Confidence: 'draft' where forms/classes are
# pedagogically standard but simplified for V1. Class numbering follows the
# broadly used Bantu noun-class numbering system.

noun_classes:
  - identifier: "1"
    label: "mu-/va-"
    prefixes: ["mu-"]
    surface_allomorphs: ["mu", "mw", "m"]
    has_zero_prefix: false
    plural_of: "2"
    semantic_tendencies: ["human beings"]
    agreement: ["a-", "u-", "wa-", "o-"]
    examples: ["murume (man)", "mukadzi (woman)", "mukomana (boy)"]
    provenance: "Fortune (1984); standard pedagogical references"
    status: attested

  - identifier: "1a"
    label: "∅- (zero)"
    prefixes: ["∅"]
    surface_allomorphs: [""]
    has_zero_prefix: true
    plural_of: "2a"
    semantic_tendencies: ["names", "kinship terms"]
    agreement: ["a-"]
    examples: ["Tatenda (name)", "mai (mother)", "baba (father)"]
    provenance: "Fortune (1984); standard pedagogical references"
    status: attested

  - identifier: "2"
    label: "va-"
    prefixes: ["va-"]
    surface_allomorphs: ["va", "v"]
    has_zero_prefix: false
    singular_of: "1"
    semantic_tendencies: ["plural of class 1 (humans)"]
    agreement: ["va-"]
    examples: ["varume (men)", "vakadzi (women)"]
    provenance: "Fortune (1984)"
    status: attested

  - identifier: "2a"
    label: "va-"
    prefixes: ["va-"]
    surface_allomorphs: ["va"]
    has_zero_prefix: false
    singular_of: "1a"
    semantic_tendencies: ["plural of class 1a (names/kinship)"]
    agreement: ["va-"]
    examples: ["vaTatenda", "vanababa (fathers)"]
    provenance: "Fortune (1984)"
    status: attested

  - identifier: "2b"
    label: "(variants under va-)"
    prefixes: []
    surface_allomorphs: ["vana-"]
    has_zero_prefix: false
    semantic_tendencies: ["emphatic/communal people, e.g. vanhu"]
    agreement: ["va-"]
    examples: ["vanhu (people)"]
    provenance: "Fortune (1984); note disagreements on classification"
    status: disputed

  - identifier: "3"
    label: "mu-/mi-"
    prefixes: ["mu-"]
    surface_allomorphs: ["mu", "mw", "m"]
    has_zero_prefix: false
    plural_of: "4"
    semantic_tendencies: ["trees, plants, inanimate objects", "body parts"]
    agreement: ["u-", "wa-", "wo-"]
    examples: ["muti (tree)", "mupata (valley)"]
    provenance: "Fortune (1984)"
    status: attested

  - identifier: "4"
