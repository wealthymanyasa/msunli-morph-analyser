# Shona lexical inventory — declarative stems.
#
# Surfaces are STEMS (the part after the noun-class/verbal prefix has been
# removed). The engine composes stems with affixes per the morphotactics.
#
# Representative, widely attested items. Confidence: draft (V1 starter).
# Provenance: standard chiShona course/dictionary references, the noun-class
# resource in noun_classes.yaml, and (for entries marked `provenance:
# "shona-spacy (shona_lexicon.json)"`) the MIT-licensed shona-spacy lexicon.
#
# Entry-level `provenance` records the immediate source of an imported entry
# without redesigning the pack provenance mechanism (see resources.yaml for
# resource-level provenance).

lexicon:
  # ── Class 1/2 (human) ───────────────────────────────────────────────────
  - surface: rume
    lemma: murume
    pos: noun
    features:
      noun_class: "1"
      number: singular

  - surface: kadzi
    lemma: mukadzi
    pos: noun
    features:
      noun_class: "1"
      number: singular

  - surface: komana
    lemma: mukomana
    pos: noun
    features:
      noun_class: "1"
      number: singular

  - surface: nhu
    lemma: munhu
    pos: noun
    features:
      noun_class: "1"
      number: singular

  - surface: sikana
    lemma: musikana
    pos: noun
    features:
      noun_class: "1"
      number: singular

  - surface: kuru
    lemma: mukuru
    pos: noun
    features:
      noun_class: "1"
      number: singular

  # ── Class 1/2 (human) — curated from shona-spacy ────────────────────────
  # Simple, non-derivational class-1 human nouns (kinship/status/loanwords)
  # whose analysis fits the existing noun-class-1 stem morphotactic, is not a
  # V1 gold true-negative probe, and does not conflict with existing entries.
  # Each is traceable to the MIT-licensed shona-spacy lexicon.
  - surface: kwasha
    lemma: mukuwasha
    pos: noun
    features:
      noun_class: "1"
      number: singular
    provenance: "shona-spacy (shona_lexicon.json)"

  - surface: rora
    lemma: murora
    pos: noun
    features:
      noun_class: "1"
      number: singular
    provenance: "shona-spacy (shona_lexicon.json)"

