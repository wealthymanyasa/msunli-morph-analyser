  - surface: shavi
    lemma: mushavi
    pos: noun
    features:
      noun_class: "1"
      number: singular
    provenance: "shona-spacy (shona_lexicon.json)"

  # ── Class 1/2 (human) — independent-evaluation resolutions ──────────────
  # Real, clearly attested class-1 human nouns that the independent evaluation
  # set (evaluation/independent.yaml) reported MSUNLI could not yet analyse.
  # Each is manually verified against shona-spacy/shona_spacy/data/
  # shona_lexicon.json. `mwana` surfaces via the class-1 `mw-` allomorph
  # BEFORE the vowel-initial stem `ana` — the allomorph is already declared in
  # morphemes.yaml, so no new morphophonology is introduced. `mudzidzisi` is
  # derivational (agentive, from kudzidzisa); only its stem/lemma are curated
  # here — derivational morphology itself remains out of V1 scope.
  - surface: ana
    lemma: mwana
    pos: noun
    features:
      noun_class: "1"
      number: singular
    provenance: "shona-spacy (shona_lexicon.json)"

  - surface: rimi
    lemma: murimi
    pos: noun
    features:
      noun_class: "1"
      number: singular
    provenance: "shona-spacy (shona_lexicon.json)"

  # NOTE on `munin'ina`: the reference's lemma is the contracted citation root
  # `n'ina`; the literal stem sitting after the class-1 `mu-` prefix is
  # `nin'ina` (mu- + nin'ina = munin'ina). The citation root `n'ina` is
  # preserved in the provenance/gloss below but is NOT the concatenative stem.
  - surface: "nin'ina"
    lemma: "munin'ina"
    pos: noun
    features:
      noun_class: "1"
      number: singular
    provenance: "shona-spacy (shona_lexicon.json); reference lemma cited as n'ina"

  - surface: dzidzisi
    lemma: mudzidzisi
    pos: noun
    features:
      noun_class: "1"
      number: singular
    provenance: "shona-spacy (shona_lexicon.json)"

  # ── Class 1a (zero-prefix kinship) ──────────────────────────────────────
  - surface: mai
    lemma: mai
    pos: noun
    features:
      noun_class: "1a"
      number: singular

  - surface: baba
