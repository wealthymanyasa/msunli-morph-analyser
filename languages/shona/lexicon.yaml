  # ── Class 3/4 (inanimate) ───────────────────────────────────────────────
  - surface: ti
    lemma: muti
    pos: noun
    features:
      noun_class: "3"
      number: singular

  - surface: pata
    lemma: mupata
    pos: noun
    features:
      noun_class: "3"
      number: singular

  - surface: sha
    lemma: musha
    pos: noun
    features:
      noun_class: "3"
      number: singular
    # shona-spacy annotates "Mumusha" flat (mu-18 + base musha); the pack
    # models the base as its class-3 stem sha -> lemma musha, matching the
    # lemma/POS/class while decomposing the class-3 morph.
    provenance: "shona-spacy (shona_lexicon.json); decomposed stem sha (base musha)"

  # ── Class 5/6 ───────────────────────────────────────────────────────────
