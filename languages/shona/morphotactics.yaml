# Shona morphotactics — declarative valid morpheme sequences.
#
# Each rule is a space-separated sequence of morpheme ids. A trailing `?`
# marks an optional token. The engine interprets these generically: tokens
# whose morpheme is `sources_lexicon: true` are matched against the lexicon;
# other tokens match one of their declared surface aliases.
#
# Rules are explicit SEQUENTIAL SLOTS — a rule may carry any number of prefix
# slots before the anchoring stem (e.g. `prefix1 prefix2 stem`); no grammar
# operators, grouping or variables are involved.
#
# Represented structures include:
#   - noun-class prefix  →  nominal stem
#   - infinitive ku-     →  verbal infinitive
#   - subject-agreement  →  tense/aspect →  verb stem         (two prefixes)
#   - locative ku-  →  class-7 prefix →  nominal stem         (two prefixes)

morphotactics:
  # Noun: single noun-class prefix + stem.
  - id: noun-class-1-stem
    sequence: "noun-class-1 stem"
  - id: noun-class-1a-stem
    sequence: "noun-class-1a stem"
  - id: noun-class-2-stem
    sequence: "noun-class-2 stem"
  - id: noun-class-2a-stem
    sequence: "noun-class-2a stem"
  - id: noun-class-3-stem
    sequence: "noun-class-3 stem"
  - id: noun-class-4-stem
    sequence: "noun-class-4 stem"
  - id: noun-class-5-stem
    sequence: "noun-class-5 stem"
  - id: noun-class-6-stem
    sequence: "noun-class-6 stem"
  - id: noun-class-7-stem
    sequence: "noun-class-7 stem"
  - id: noun-class-8-stem
    sequence: "noun-class-8 stem"
  - id: noun-class-9-stem
    sequence: "noun-class-9 stem"
  - id: noun-class-10-stem
    sequence: "noun-class-10 stem"
  - id: noun-class-11-stem
    sequence: "noun-class-11 stem"
  - id: noun-class-12-stem
    sequence: "noun-class-12 stem"
  - id: noun-class-13-stem
    sequence: "noun-class-13 stem"
  - id: noun-class-14-stem
    sequence: "noun-class-14 stem"
  - id: noun-class-15-stem
    sequence: "noun-class-15 stem"
  - id: noun-class-16-stem
    sequence: "noun-class-16 stem"
  - id: noun-class-17-stem
    sequence: "noun-class-17 stem"
  - id: noun-class-18-stem
    sequence: "noun-class-18 stem"

  # Verbal infinitive: class 15 ku- + verb stem.
  # (Class 15 IS the infinitive class in Shona; the class-15 rule above applies
  # to verb stems too — no separate rule, which would duplicate the sequence.)

  # Conjugated verb: 1sg subject agreement + optional perfect + verb stem.
  # e.g. nd-a-enda -> "I have gone".
  - id: sagr-tam-stem
    sequence: "sagr-1sg tam-perfect? stem"

  # ── Multi-prefix stacking (declared demonstration) ──────────────────────
  # Stacked nominal prefixes: an outer locative/diminutive prefix slot in
  # front of an inner noun-class prefix slot, then the stem. Same explicit
  # sequential-slot grammar — the engine stacks any number of prefix slots
  # before the anchoring stem (ku-chi-koro, mu-mu-rume, mu-mu-sha, mu-rw-izi,
  # ka-mu-kadzi).
  #
  # The generic noun-class-agreement constraint treats locative classes 16/17/18
  # (declared in constraints.yaml outer_classes) as valid OUTER substitutes when
  # they stack over an inner agreeing prefix, so ku-chi-koro (class 17 over
  # class 7), mu-mu-rume (class 18 over class 1), mu-mu-sha (class 18 over
  # class 3) and mu-rw-izi (class 18 over class 11) analyse. The diminutive
  # class 12 is not an exempt outer class, so ka-mu-kadzi is still rejected.
  - id: locative-17-over-class-7
    sequence: "noun-class-17 noun-class-7 stem"   # ku- + chi- + stem  (eg ku-chi-koro)
  - id: locative-18-over-class-1
    sequence: "noun-class-18 noun-class-1 stem"   # mu- + mu- + stem   (eg mu-mu-rume)
  - id: locative-18-over-class-3
    sequence: "noun-class-18 noun-class-3 stem"   # mu- + mu- + stem   (eg mu-mu-sha)
  - id: locative-18-over-class-11
    sequence: "noun-class-18 noun-class-11 stem"  # mu- + rw- + stem   (eg mu-rw-izi)
  - id: diminutive-12-over-class-1
    sequence: "noun-class-12 noun-class-1 stem"   # ka- + mu- + stem   (eg ka-mu-kadzi)
