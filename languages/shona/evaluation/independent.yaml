# Independent Shona evaluation set.
#
# Purpose
# -------
# The `gold.yaml` dataset in this directory is derived from the engine's own
# verified output, so a run over it is necessarily perfect. This file is a
# SEPARATE, independent set curated from the MIT-licensed reference lexicon
# `shona-spacy/shona_spacy/data/shona_lexicon.json` (READ-ONLY) so that the
# evaluator measures the engine against an *external* reference rather than
# against itself.
#
# Independence & honesty
# ----------------------
# - The expected analysis in `analyses` is the independent truth established by
#   manually inspecting the reference annotation (and standard chiShona
#   grammar), NOT whatever the engine happens to produce.
# - `source_annotation` records the *reference lexicon's* annotation verbatim.
#   It is surfaced in the failure report verbatim and never affects scoring.
# - `verification_status` records the outcome of comparing the reference with
#   the engine:
#     * `agree`                      — reference and engine agree on structure.
#     * `disagree_msunli_unknown`    — the word is real (per reference) but the
#       current MSUNLI pack does not analyse it. This is an honest limitation,
#       reported, not fixed here.
#     * `disagree_lemma_convention`  — structure agrees but lemma notation
#       differs (reference stores bare stems; the pack stores prefixed lemmas).
#     * `disagree_pos`               — engine analyses a word but tags it with a
#       different POS than the reference.
#
# Lemma-notation divergence
# -------------------------
# The reference lexicon stores lemmas as BARE STEMS (e.g. `rume` for `Murume`),
# while this pack's `lexicon.yaml` deliberately stores lemmas as PREFIXED
# protolemmas (e.g. `murume`). Both are defensible citation forms. The expected
# analysis below uses the pack's prefixed-lemma convention (so lemma scoring is
# meaningful and consistent), and `source_annotation.lemma` records the reference
# bare-stem form so the divergence is explicit rather than hidden.
#
# Coverage: noun singulars (class 1), noun plurals (class 2), locatives
# (classes 17/18), class-19 `pf-` nouns, class-20 `ku-` nominalisations,
# diminutives/augmentatives, and closed-class words (pronouns, demonstratives,
# adverbs). Several records deliberately exercise shared/multiple-prefix and
# low-coverage areas and therefore expose genuine disagreements.

- surface: murume
  status: analysed
  verification_status: agree
  provenance: shona-spacy (shona_lexicon.json); manually inspected
  source_annotation:
    token: Murume
    lemma: rume
    pos: NOUN
    noun_class: "1"
    verified_manually: true
  analyses:
  - lemma: murume
    pos: noun
    morphemes:
    - surface: mu
      type: noun-class-1
    - surface: rume
      type: stem
    features:
      noun_class: "1"
      number: singular

