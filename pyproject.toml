[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "morph-analyser"
version = "1.0.0"
description = "Reusable, language-agnostic morphological analysis platform"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "MSUNLI" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "fastapi>=0.100,<1.0",
    "uvicorn>=0.23",
    "typer>=0.9",
]

[project.urls]
Homepage = "https://github.com/msunli/msunli-morph-analyser"
Repository = "https://github.com/msunli/msunli-morph-analyser"
Documentation = "https://github.com/msunli/msunli-morph-analyser/tree/main/docs"
Issues = "https://github.com/msunli/msunli-morph-analyser/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "ruff>=0.1.0",
    "httpx>=0.24",
]

[project.scripts]
morph = "morph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
# B008 flags function calls in argument defaults (Depends(...), typer.Option(...)),
# which are the idiomatic patterns for FastAPI dependency injection and Typer CLI
# options. These are safe and intended.
ignore = ["B008"]
